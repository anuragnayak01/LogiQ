<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Manifest — Internal Knowledge Base</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f5f6f4;
    --surface: #ffffff;
    --surface-2: #eef0ee;
    --border: #dfe3df;
    --ink: #16211c;
    --ink-muted: #667066;
    --accent: #d97f0c;
    --accent-ink: #4a2e05;
    --accent-soft: #fdf1de;
    --verified: #1c8a72;
    --verified-soft: #e4f5f0;
    --training: #4a5fd9;
    --training-soft: #eaedfc;
    --radius: 10px;
  }

  * { box-sizing: border-box; }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
  }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
  }

  body {
    display: flex;
    flex-direction: column;
    background-image:
      linear-gradient(var(--paper), var(--paper)),
      repeating-linear-gradient(90deg, rgba(22,33,28,0.035) 0px, rgba(22,33,28,0.035) 1px, transparent 1px, transparent 64px);
  }

  header {
    border-bottom: 1px solid var(--border);
    padding: 16px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface);
    flex-shrink: 0;
    position: sticky;
    top: 0;
    z-index: 5;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .brand-icon {
    width: 30px;
    height: 30px;
    border-radius: 7px;
    background: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .brand-icon svg { width: 16px; height: 16px; }

  .brand-text { display: flex; flex-direction: column; line-height: 1.15; }

  .brand-mark {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 17px;
    letter-spacing: 0.01em;
  }

  .brand-sub {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    color: var(--ink-muted);
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  .status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 6px 12px;
    border: 1px solid var(--border);
    border-radius: 20px;
    background: var(--paper);
  }

  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--ink-muted);
  }
  .status-dot.online { background: var(--verified); box-shadow: 0 0 0 3px var(--verified-soft); }
  .status-dot.offline { background: #c94f3f; box-shadow: 0 0 0 3px #fbe6e2; }

  main {
    flex: 1;
    overflow-y: auto;
    display: flex;
    justify-content: center;
    scroll-behavior: smooth;
  }

  .thread {
    width: 100%;
    max-width: 700px;
    padding: 32px 20px 130px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .intro {
    padding: 26px 26px 24px;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: var(--surface);
    box-shadow: 0 1px 2px rgba(22,33,28,0.04);
  }

  .intro-eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    color: var(--accent-ink);
    background: var(--accent-soft);
    padding: 4px 9px;
    border-radius: 20px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 14px;
  }

  .intro h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 23px;
    line-height: 1.3;
    margin: 0 0 10px;
    letter-spacing: -0.01em;
  }

  .intro p {
    color: var(--ink-muted);
    font-size: 14.5px;
    line-height: 1.65;
    margin: 0 0 20px;
    max-width: 52ch;
  }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .chip {
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 13px;
    padding: 9px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--paper);
    color: var(--ink);
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s, transform 0.1s;
  }
  .chip:hover, .chip:focus-visible { border-color: var(--accent); background: var(--accent-soft); outline: none; }
  .chip:active { transform: scale(0.98); }

  .msg { display: flex; flex-direction: column; gap: 6px; animation: rise 0.25s ease; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .msg.user { align-items: flex-end; }
  .msg.agent { align-items: flex-start; }

  .bubble-row { display: flex; align-items: flex-end; gap: 8px; max-width: 92%; }
  .msg.agent .bubble-row { flex-direction: row; }
  .msg.user .bubble-row { flex-direction: row-reverse; }

  .avatar {
    width: 26px; height: 26px;
    border-radius: 7px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    font-weight: 600;
  }
  .msg.agent .avatar { background: var(--ink); color: var(--paper); }
  .msg.user .avatar { background: var(--surface-2); color: var(--ink-muted); border: 1px solid var(--border); }

  .bubble {
    padding: 12px 16px;
    border-radius: var(--radius);
    font-size: 14.5px;
    line-height: 1.6;
    white-space: pre-wrap;
  }
  .msg.user .bubble {
    background: var(--ink);
    color: var(--paper);
    border-bottom-right-radius: 3px;
  }
  .msg.agent .bubble {
    background: var(--surface);
    border: 1px solid var(--border);
    border-bottom-left-radius: 3px;
  }

  .role-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--ink-muted);
    padding: 0 34px;
  }
  .msg.user .role-label { padding-right: 34px; padding-left: 0; text-align: right; }

  /* Manifest stub — signature element: a torn packing-slip / ticket citation */
  .manifest {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 2px;
    max-width: 92%;
    padding-left: 34px;
  }

  .manifest-tag {
    position: relative;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: none;
    border-radius: 3px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    overflow: hidden;
  }

  /* perforated stub edge */
  .manifest-tag::before {
    content: "";
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 5px;
    background: repeating-linear-gradient(
      to bottom,
      var(--accent) 0px, var(--accent) 5px,
      transparent 5px, transparent 10px
    );
  }

  .manifest-tag .doctype {
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.06em;
    padding: 3px 7px;
    border-radius: 3px;
    text-transform: uppercase;
    flex-shrink: 0;
    margin-left: 4px;
  }
  .doctype.sop { background: var(--accent-soft); color: var(--accent-ink); }
  .doctype.policy { background: var(--verified-soft); color: var(--verified); }
  .doctype.training { background: var(--training-soft); color: var(--training); }

  .manifest-tag .title { color: var(--ink); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
  .manifest-tag .match { color: var(--ink-muted); flex-shrink: 0; }

  .typing { display: flex; gap: 4px; padding: 14px 16px; }
  .typing span {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--ink-muted);
    animation: pulse 1.1s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes pulse { 0%, 60%, 100% { opacity: 0.25; } 30% { opacity: 1; } }

  footer {
    position: sticky;
    bottom: 0;
    border-top: 1px solid var(--border);
    background: var(--surface);
    padding: 16px 20px 20px;
    display: flex;
    justify-content: center;
  }

  form {
    width: 100%;
    max-width: 700px;
    display: flex;
    gap: 10px;
  }

  input[type="text"] {
    flex: 1;
    background: var(--paper);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 13px 16px;
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    font-size: 14.5px;
  }
  input[type="text"]:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
    border-color: var(--accent);
  }
  input[type="text"]::placeholder { color: var(--ink-muted); }

  button {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 14px;
    background: var(--ink);
    color: var(--paper);
    border: none;
    border-radius: var(--radius);
    padding: 0 24px;
    cursor: pointer;
    transition: background 0.15s;
  }
  button:hover, button:focus-visible { background: var(--accent); color: var(--accent-ink); outline: none; }
  button:disabled { background: var(--surface-2); color: var(--ink-muted); cursor: not-allowed; }

  @media (max-width: 600px) {
    header { padding: 13px 16px; }
    .brand-sub { display: none; }
    .thread { padding: 24px 14px 110px; }
    footer { padding: 12px 14px 16px; }
    .intro { padding: 20px; }
    .intro h1 { font-size: 20px; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="brand-icon">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 6h16M4 12h16M4 18h10" stroke="#f5f6f4" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </span>
    <div class="brand-text">
      <span class="brand-mark">Manifest</span>
      <span class="brand-sub">Internal Knowledge Base</span>
    </div>
  </div>
  <div class="status">
    <span class="status-dot" id="statusDot"></span>
    <span id="statusText">connecting…</span>
  </div>
</header>

<main>
  <div class="thread" id="thread">
    <div class="intro">
      <div class="intro-eyebrow">Ask before you act</div>
      <h1>Ask about SOPs, policies, or training</h1>
      <p>Answers are pulled directly from indexed company documents — receiving procedures, HR policy, safety training. Every answer cites its source, stamped like a manifest.</p>
      <div class="chips">
        <button class="chip" type="button">What's the pre-shift forklift checklist?</button>
        <button class="chip" type="button">How much PTO can I roll over?</button>
        <button class="chip" type="button">What do I do if a shipment seal doesn't match the BOL?</button>
        <button class="chip" type="button">How many attendance points trigger a written warning?</button>
      </div>
    </div>
  </div>
</main>

<footer>
  <form id="chatForm">
    <input type="text" id="questionInput" placeholder="Ask a question about company SOPs, policy, or training…" autocomplete="off" />
    <button type="submit" id="sendBtn">Ask</button>
  </form>
</footer>

<script>
  // Point this at your deployed FastAPI backend (Render, Fly.io, etc.)
  const API_BASE_URL = window.MANIFEST_API_BASE_URL || "https://logiq-nr7d.onrender.com";

  const thread = document.getElementById('thread');
  const form = document.getElementById('chatForm');
  const input = document.getElementById('questionInput');
  const sendBtn = document.getElementById('sendBtn');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const sessionId = 'demo-' + Math.random().toString(36).slice(2, 10);

  async function checkHealth() {
    try {
      const res = await fetch(`${API_BASE_URL}/health`);
      const data = await res.json();
      statusDot.classList.add('online');
      statusText.textContent = `live · ${data.llm_provider}`;
    } catch (e) {
      statusDot.classList.add('offline');
      statusText.textContent = 'backend offline';
    }
  }
  checkHealth();

  function addMessage(role, text) {
    const msg = document.createElement('div');
    msg.className = `msg ${role}`;

    const label = document.createElement('div');
    label.className = 'role-label';
    label.textContent = role === 'user' ? 'You' : 'Manifest';

    const row = document.createElement('div');
    row.className = 'bubble-row';

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = role === 'user' ? 'Y' : 'M';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;

    row.appendChild(avatar);
    row.appendChild(bubble);
    msg.appendChild(label);
    msg.appendChild(row);
    thread.appendChild(msg);
    thread.scrollTop = thread.scrollHeight;
    return msg;
  }

  function addSources(sources) {
    if (!sources || sources.length === 0) return;
    const wrap = document.createElement('div');
    wrap.className = 'manifest';
    sources.forEach(s => {
      const tag = document.createElement('div');
      tag.className = 'manifest-tag';
      const type = document.createElement('span');
      type.className = `doctype ${s.doc_type}`;
      type.textContent = s.doc_type;
      const title = document.createElement('span');
      title.className = 'title';
      title.textContent = s.title.replace(/_/g, ' ');
      const match = document.createElement('span');
      match.className = 'match';
      match.textContent = `${Math.round(s.similarity * 100)}% match`;
      tag.appendChild(type);
      tag.appendChild(title);
      tag.appendChild(match);
      wrap.appendChild(tag);
    });
    thread.appendChild(wrap);
    thread.scrollTop = thread.scrollHeight;
  }

  function addTyping() {
    const msg = document.createElement('div');
    msg.className = 'msg agent';
    msg.id = 'typingIndicator';
    const row = document.createElement('div');
    row.className = 'bubble-row';
    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = 'M';
    const bubble = document.createElement('div');
    bubble.className = 'bubble typing';
    bubble.innerHTML = '<span></span><span></span><span></span>';
    row.appendChild(avatar);
    row.appendChild(bubble);
    msg.appendChild(row);
    thread.appendChild(msg);
    thread.scrollTop = thread.scrollHeight;
  }

  function removeTyping() {
    const el = document.getElementById('typingIndicator');
    if (el) el.remove();
  }

  async function ask(question) {
    addMessage('user', question);
    input.value = '';
    sendBtn.disabled = true;
    addTyping();

    try {
      const res = await fetch(`${API_BASE_URL}/chat`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question, session_id: sessionId })
      });
      if (!res.ok) throw new Error(`Request failed: ${res.status}`);
      const data = await res.json();
      removeTyping();
      addMessage('agent', data.answer);
      addSources(data.sources);
    } catch (err) {
      removeTyping();
      addMessage('agent', "Couldn't reach the knowledge base backend. Check that the API is running and CORS is configured for this origin.");
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const q = input.value.trim();
    if (!q) return;
    ask(q);
  });

  document.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => ask(chip.textContent));
  });
</script>

</body>
</html>
